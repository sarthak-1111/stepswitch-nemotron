# The Nemotron ladder with every work step starting on Nano (ADR 0044). Used for
# the escalation demo, not for the claims: C-029 and C-030 use tokenfactory-ladder.toml.
#
#   Nemotron 3 Nano          edit, run and triage, until the gates fail twice
#   Nemotron 3.5 Lightning   navigate, read, summarize, write-text
#   Nemotron 3 Ultra         plan, review, and the work steps after an escalation
#   gpt-oss-120b             a second opinion on Ultra's review, from another model family
#
# `escalations` counts how often the gates failed enough times to move the task up the ladder.
schema = 1

[privacy]
mode = "default"
redact = "remote"
deny_paths = [".env", ".env.*", "secrets/**", "*.pem", "*.key"]

[budgets]
usd = 0.50
wall_seconds = 1800

[budgets.roles.summarize]
effort = "none"

[budgets.roles.write-text]
effort = "none"

[budgets.roles.review]
effort = "none"
max_output_tokens = 2000

[review]
second_opinion = true

[[policy.rules]]
name = "lightning-reads-and-summarizes"
when = { step_type = ["navigate", "read", "summarize", "write-text"] }
to = { model = "nvidia/Nemotron-3_5-Lightning" }

[[policy.rules]]
name = "nano-tries-the-work-first"
when = { step_type = ["edit", "run", "triage"], escalations = 0 }
to = { model = "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B" }

[[policy.rules]]
name = "ultra-plans-reviews-and-takes-escalations"
when = { step_type = ["plan", "review", "edit", "run", "triage"] }
to = { model = "nvidia/Nemotron-3-Ultra-550b-a55b" }

[tracks.general]
gates = ["format", "lint", "typecheck", "impacted_tests", "full_tests"]

[tracks.science]
offline = false
